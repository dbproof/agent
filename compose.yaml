# Postgres servers for the schema round-trip tests: the oldest and newest supported
# majors. The newest runs the pgvector image, which pagila.sql needs.
# Health checks connect over TCP: on first start the image runs a temporary
# server on the Unix socket only, for initialization, then restarts, so a
# socket check could pass before the real server is up.
services:
  pg13:
    image: postgres:13-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["54313:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 1s
      retries: 30
  pg18:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["54318:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 1s
      retries: 30
