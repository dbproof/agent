syntax = "proto3";

package dbproof.agent.v1;

import "buf/validate/validate.proto";

// CaptureService receives production snapshots from the agent. Every call
// carries the project's capture token as a bearer token; the token names the
// project, and can only upload.
//
// The server accepts agents released in the last 12 months, so changes here
// must pass buf breaking.
service CaptureService {
  // GetCaptureConfig returns what the agent needs before it inspects the
  // database: which tables to leave out and where the migration history is.
  rpc GetCaptureConfig(GetCaptureConfigRequest) returns (GetCaptureConfigResponse);
  // UploadSnapshot stores a snapshot. Retrying with the same upload_id is safe.
  rpc UploadSnapshot(UploadSnapshotRequest) returns (UploadSnapshotResponse);
}

// MigrationTool is the tool whose history table the agent reads.
enum MigrationTool {
  MIGRATION_TOOL_UNSPECIFIED = 0;
  MIGRATION_TOOL_FLYWAY = 1;
  MIGRATION_TOOL_ATLAS = 2;
}

message GetCaptureConfigRequest {
  string agent_version = 1;
}

message GetCaptureConfigResponse {
  // project is "org/slug", for the agent's log.
  string project = 1;
  MigrationTool tool = 2;
  // history_table is the migration history table, e.g.
  // public.flyway_schema_history.
  string history_table = 3;
  // exclusions are "schema.*" and "schema.table" patterns to leave out.
  repeated string exclusions = 4;
  // min_agent_version is the oldest agent the server still supports; older
  // agents log an upgrade warning.
  string min_agent_version = 5;
}

message UploadSnapshotRequest {
  // upload_id is generated by the agent once per capture.
  string upload_id = 1 [(buf.validate.field).string.uuid = true];
  // snapshot is the gzipped JSON the agent's snapshot package writes.
  bytes snapshot = 2 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 33554432
  }];
  string agent_version = 3 [(buf.validate.field).string.max_len = 64];
  // commit_sha is the deployed commit, when the agent knows it.
  string commit_sha = 4 [(buf.validate.field).string.max_len = 64];
}

message UploadSnapshotResponse {
  string capture_id = 1;
  string min_agent_version = 2;
}
