name: DbProof capture
description: Capture the production schema and planner statistics, and upload them to DbProof.
inputs:
  kind:
    description: When this capture runs, pre (before migrations), post (after) or scheduled.
    required: true
  dbproof-url:
    description: DbProof's address.
    required: true
  capture-token:
    description: The project's upload-only capture token.
    required: true
  capture-dsn:
    description: Connection string for a role that can read the migration history, such as the one your migrations run as.
    required: true
  expect-version:
    description: Post-deploy, the migration version to wait for in the history.
    default: ""
runs:
  using: composite
  steps:
    # The agent's source sits in the action's own checkout, outside the
    # workspace, where setup-go's cache can't hash go.sum. So the built
    # binary itself is cached, keyed by a hash of that source.
    - name: Find the agent
      shell: bash
      run: |
        root=$(cd "$GITHUB_ACTION_PATH/../.." && pwd)
        echo "DBPROOF_AGENT_ROOT=$root" >> "$GITHUB_ENV"
        files=$(cd "$root" && find . -name '*.go' -o -name go.mod -o -name go.sum | LC_ALL=C sort)
        # openssl, not sha256sum: macOS runners have only the former.
        echo "DBPROOF_AGENT_SOURCE=$( (echo "$files"; cd "$root" && echo "$files" | xargs cat) | openssl dgst -sha256 | awk '{print substr($NF, 1, 16)}')" >> "$GITHUB_ENV"
    - id: agent-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/dbproof
        key: dbproof-agent-${{ runner.os }}-${{ runner.arch }}-${{ env.DBPROOF_AGENT_SOURCE }}-${{ github.action_ref || 'dev' }}
    - if: steps.agent-cache.outputs.cache-hit != 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ env.DBPROOF_AGENT_ROOT }}/go.mod
        cache: false
    - name: Build the DbProof agent
      if: steps.agent-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ github.action_ref || 'dev' }}
      run: go build -C "$DBPROOF_AGENT_ROOT" -ldflags "-X main.version=$VERSION" -o "$RUNNER_TEMP/dbproof" ./cmd/dbproof
    # Capture never fails the job: a capture that can't run must not stop a
    # deploy. The agent says what went wrong as a warning.
    - name: Capture the schema
      shell: bash
      env:
        DBPROOF_URL: ${{ inputs.dbproof-url }}
        DBPROOF_CAPTURE_TOKEN: ${{ inputs.capture-token }}
        DBPROOF_CAPTURE_DSN: ${{ inputs.capture-dsn }}
        KIND: ${{ inputs.kind }}
        EXPECT_VERSION: ${{ inputs.expect-version }}
      run: '"$RUNNER_TEMP/dbproof" capture -kind="$KIND" ${EXPECT_VERSION:+-expect-version="$EXPECT_VERSION"}'
