name: DbProof check
description: Test a pull request's migrations against a snapshot of the production schema.
inputs:
  project:
    description: The DbProof project, org/slug.
    required: true
  migrations-dir:
    description: The migrations folder, relative to the repository root.
    required: true
  migrate-command:
    description: >-
      Your migrate command. It finds the throwaway database in DBPROOF_CHECK_*
      variables, e.g. flyway -url=$DBPROOF_CHECK_JDBC_URL migrate.
    required: true
  dbproof-url:
    description: DbProof's address.
    required: true
  database:
    description: >-
      postgres:// URL of an empty throwaway database, as a superuser. By
      default the check starts postgres-image in Docker instead.
    default: ""
  postgres-image:
    description: >-
      The Docker image the check starts when no database is given. {major} is
      production's Postgres major version, so the check runs on the version
      production does; use an image with your extensions, e.g.
      pgvector/pgvector:pg{major}.
    default: postgres:{major}
  fail-on-unreachable:
    description: Fail instead of passing with a warning when DbProof is unreachable.
    default: "false"
runs:
  using: composite
  steps:
    # The agent builds from this action's own checkout, so the version that
    # runs is exactly the commit the workflow pins. That source sits outside
    # the workspace, where setup-go's cache can't hash go.sum, so the built
    # binary itself is cached, keyed by a hash of the source.
    - name: Find the agent
      shell: bash
      run: |
        root=$(cd "$GITHUB_ACTION_PATH/../.." && pwd)
        echo "DBPROOF_AGENT_ROOT=$root" >> "$GITHUB_ENV"
        # Read here: in a step that uses another action, github.action_ref is
        # that action's ref, not this one's.
        echo "DBPROOF_AGENT_REF=${{ github.action_ref || 'dev' }}" >> "$GITHUB_ENV"
        files=$(cd "$root" && find . -name '*.go' -o -name go.mod -o -name go.sum | LC_ALL=C sort)
        # openssl, not sha256sum: macOS runners have only the former.
        echo "DBPROOF_AGENT_SOURCE=$( (echo "$files"; cd "$root" && echo "$files" | xargs cat) | openssl dgst -sha256 | awk '{print substr($NF, 1, 16)}')" >> "$GITHUB_ENV"
    - id: agent-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/dbproof
        key: dbproof-agent-${{ runner.os }}-${{ runner.arch }}-${{ env.DBPROOF_AGENT_SOURCE }}-${{ env.DBPROOF_AGENT_REF }}
    - if: steps.agent-cache.outputs.cache-hit != 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ env.DBPROOF_AGENT_ROOT }}/go.mod
        cache: false
    - name: Build the DbProof agent
      if: steps.agent-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ env.DBPROOF_AGENT_REF }}
      run: go build -C "$DBPROOF_AGENT_ROOT" -ldflags "-X main.version=$VERSION" -o "$RUNNER_TEMP/dbproof" ./cmd/dbproof
    - name: Check migrations
      shell: bash
      env:
        DBPROOF_URL: ${{ inputs.dbproof-url }}
        DBPROOF_PROJECT: ${{ inputs.project }}
        DBPROOF_CHECK_DSN: ${{ inputs.database }}
        DBPROOF_POSTGRES_IMAGE: ${{ inputs.postgres-image }}
        MIGRATIONS_DIR: ${{ inputs.migrations-dir }}
        MIGRATE_COMMAND: ${{ inputs.migrate-command }}
        FAIL_ON_UNREACHABLE: ${{ inputs.fail-on-unreachable }}
      run: >-
        "$RUNNER_TEMP/dbproof" check -migrations-dir "$MIGRATIONS_DIR"
        -migrate-command "$MIGRATE_COMMAND" -fail-on-unreachable="$FAIL_ON_UNREACHABLE"
