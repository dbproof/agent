name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # buf breaking compares a pull request with its base branch.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # Tools, codegen, Postgres 13 and 18, buf lint, golangci-lint and every
      # test, including the round trip and the cross-major diff.
      - name: just check
        run: just check
      - name: Generated code is committed
        run: git diff --exit-code -- gen
      # The server supports agents from the last 12 months, so the agent API
      # can't break them.
      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: bin/buf breaking --against ".git#branch=origin/${{ github.base_ref }}"

  # The GitHub Actions customers use build the agent and run it. Without a
  # token capture skips, and with Stratum unreachable check passes with a
  # warning: both exit 0, which proves the actions build and wire the agent.
  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./actions/capture
        with:
          kind: scheduled
          stratum-url: http://localhost:9
          capture-token: ""
          capture-dsn: ""
      - uses: ./actions/check
        env:
          STRATUM_CHECK_TOKEN: smoke-test
        with:
          project: smoke/test
          migrations-dir: testdata
          migrate-command: "false"
          stratum-url: http://localhost:9
          fail-on-unreachable: "false"
