name: CI

# Documentation ships in no release, so a change to only it isn't tested.
on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']

# A new commit on a pull request makes its running checks moot, so they stop.
# Runs on main each get their own group and are never cancelled: the release
# follows them.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # buf breaking compares a pull request with its base branch.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # Node.js runs the real Prisma and Drizzle Kit in their check test.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Tools, codegen, Postgres 13 and 18, buf lint, golangci-lint and every
      # test, including the round trip, the cross-major diff and the real
      # Prisma and Drizzle Kit.
      - name: just check
        env:
          DBPROOF_TEST_NODE_TOOLS: "1"
        run: just check
      - name: Generated code is committed
        run: git diff --exit-code -- gen
      # The server supports agents from the last 12 months, so the agent API
      # can't break them.
      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: bin/buf breaking --against ".git#branch=origin/${{ github.base_ref }}"

  # The GitHub Actions customers use build the agent and run it. Without a
  # token capture skips, and with DbProof unreachable check passes with a
  # warning: both exit 0, which proves the actions build and wire the agent.
  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./actions/capture
        with:
          kind: scheduled
          dbproof-url: http://localhost:9
          capture-token: ""
          capture-dsn: ""
      - uses: ./actions/check
        env:
          DBPROOF_CHECK_TOKEN: smoke-test
        with:
          project: smoke/test
          migrations-dir: testdata
          migrate-command: "false"
          dbproof-url: http://localhost:9
          fail-on-unreachable: "false"
